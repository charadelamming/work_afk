[package]
name = "reborn-work"
version = "0.1.1"
description = "重生之我挂机上班 - 桌面工资实时到账小组件"
authors = ["reborn-work"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reborn_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }
tauri-codegen = "=2.5.5"
tauri-utils = { version = "=2.8.3", features = ["build"] }

[dependencies]
tauri = { version = "=2.10.3", features = ["tray-icon", "image-png"] }
tauri-macros = "=2.5.5"
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tauri-utils = "=2.8.3"
# 走系统 TLS（Windows = schannel），不引入 ring：本机 MSVC 编译 ring 的 C 代码会报 D8050
# （cc-rs 启动 cl.exe 时环境块过大），改用 native-tls 可完全绕开 C 编译，签名校验逻辑不变
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
